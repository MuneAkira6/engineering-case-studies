# Checks the Markdown of this repository: every relative link resolves and the Japanese prose holds no
# Chinese character forms or words (tools/check.ts). No dependencies, so there is no install step.
#
# Every `uses:` is pinned to a commit SHA with its version as a comment.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: links and wording
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check links and wording
        run: node tools/check.ts
